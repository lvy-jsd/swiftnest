[package]
name = "swiftnest-app"
version = "0.0.1"
description = "Swiftnest desktop app"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "swiftnest_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = { version = "2.8.3", default-features = false, features = ["rustls-tls", "http2", "unsafe-headers"] }
tauri-plugin-websocket = { version = "2.5.0", default-features = false, features = ["rustls-tls"] }

swiftnest-perch = { path = "../../native/perch" }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
