# Swiftnest's built-in modules, layered after dsh-base and dsh-web-app.
# Rows only add; they never replace DSH's own rows or its Web UI.
- insert:
    - id: swiftnest-core
      name: "@swiftnest/server-bundle/core"
      config:
        version: !!js process.env.SWIFTNEST_VERSION
        modelBaseUrl: !!js process.env.SWIFTNEST_MODEL_BASE_URL
        appDist: !!js process.env.SWIFTNEST_APP_DIST
        home: !!js process.env.SWIFTNEST_HOME
        devicesAdminUrl: !!js process.env.SWIFTNEST_DEVICES_ADMIN_URL
        devicesAdminToken: !!js process.env.SWIFTNEST_DEVICES_ADMIN_TOKEN
    - id: swiftnest-devices
      name: "@swiftnest/server-bundle/native-devices"
      config:
        devicesAdminUrl: !!js process.env.SWIFTNEST_DEVICES_ADMIN_URL
        devicesAdminToken: !!js process.env.SWIFTNEST_DEVICES_ADMIN_TOKEN
    - id: swiftnest-memory
      name: "@swiftnest/server-bundle/memory"
      config:
        home: !!js process.env.SWIFTNEST_HOME
        enabled: !!js process.env.SWIFTNEST_MEMORY !== 'false'
        devicesAdminUrl: !!js process.env.SWIFTNEST_DEVICES_ADMIN_URL
        devicesAdminToken: !!js process.env.SWIFTNEST_DEVICES_ADMIN_TOKEN
    - id: swiftnest-chat-search
      name: "@swiftnest/server-bundle/chat-search"
      config:
        home: !!js process.env.SWIFTNEST_HOME
        localBaseUrl: !!js process.env.SWIFTNEST_MODEL_BASE_URL
        localModel: !!js process.env.SWIFTNEST_SEARCH_LOCAL_MODEL
        localApiKey: !!js process.env[process.env.SWIFTNEST_SEARCH_LOCAL_KEY_ENV]
        settings: !!js JSON.parse(process.env.SWIFTNEST_SEARCH_CONFIG || '{}')
