name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - name: e2e (real DSH kernel, fake model)
        run: pnpm vitest run server packages client
        env:
          SWIFTNEST_E2E: '1'

  mesh:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/mesh
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/mesh
      - run: cargo clippy --all-targets
      - run: cargo test
