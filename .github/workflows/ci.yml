name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - run: pnpm lint:i18n
      - run: pnpm test
      - run: pnpm docs:build
      - name: Build the web App and install Chromium for browser e2e
        run: |
          pnpm --filter ./client build:web
          pnpm --filter ./client exec playwright install --with-deps chromium
      - name: e2e (real DSH kernel, fake model, browser)
        run: pnpm vitest run server packages client
        env:
          SWIFTNEST_E2E: "1"
          SWIFTNEST_TOOL_ULTRA_E2E: "1"
          SWIFTNEST_WEB_E2E: "1"

  # The device core (Shell, files, screen, transfers). Tests run the real
  # bubblewrap sandbox, so the runner must allow unprivileged user namespaces.
  perch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --unshare-all --ro-bind / / true
      - run: cargo fmt -p swiftnest-perch --check
      - run: cargo clippy -p swiftnest-perch --all-targets -- -D warnings
      - run: cargo test -p swiftnest-perch

  native-language:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p swiftnest-locale
